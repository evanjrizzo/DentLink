name: CI

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Check diff whitespace
        run: git diff --check

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Validate Worker build
        run: pnpm exec wrangler deploy --dry-run --env="" --outdir /tmp/dentlink-worker
