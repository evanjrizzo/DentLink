name: Deploy Preview

on:
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Check diff whitespace
        run: git diff --check

      - name: Apply preview D1 migrations
        run: pnpm db:migrate:preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview Worker
        run: pnpm deploy:preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build preview web client
        run: pnpm --filter @dentlink/web build
        env:
          VITE_DENTLINK_API_BASE_URL: ${{ secrets.DENTLINK_PREVIEW_API_BASE_URL }}

      - name: Deploy preview web client
        run: pnpm deploy:web:preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test preview API
        run: pnpm smoke:api
        env:
          DENTLINK_SMOKE_BASE_URL: ${{ secrets.DENTLINK_PREVIEW_API_BASE_URL }}
