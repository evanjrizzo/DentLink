[package]
name = "dentlink-desktop"
version = "0.0.0"
description = "DentLink desktop client"
authors = ["DentLink"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dentlink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dentlink-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gdk = "0.18.2"
gtk = "0.18.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
