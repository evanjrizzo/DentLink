name = "dentlink-api"
main = "apps/api/src/index.ts"
compatibility_date = "2026-07-14"
workers_dev = true
preview_urls = true

[vars]
DENTLINK_ENV = "local"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8787,http://127.0.0.1:8787"
DENTLINK_BUILD_ID = "local"
GOOGLE_REDIRECT_URI = "http://127.0.0.1:8787/v1/connectors/gmail/callback"
GOOGLE_CALENDAR_REDIRECT_URI = "http://127.0.0.1:8787/v1/connectors/google-calendar/callback"
DENTLINK_WEB_ORIGIN = "http://localhost:5173"
DENTLINK_AI_ENABLED = "true"
DENTLINK_AI_MODEL = "gpt-4.1-mini"
DENTLINK_AI_MAX_INPUT_CHARS = "6000"
DENTLINK_ALERT_EMAIL_TO = "evanjrizzo@gmail.com"
DENTLINK_ALERT_EMAIL_FROM = "alerts@dentlabs.net"
DENTLINK_ARCHIVE_MAX_TOTAL_BYTES = "9000000000"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_ENABLED = "false"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_USER_IDS = ""
DENTLINK_REQUIRE_CONTENT_ENCRYPTION = "false"
DENTLINK_CONTENT_ENCRYPTION_BACKFILL_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "dentlink"
database_id = "local-dentlink-dev"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[env.preview]
name = "dentlink-api-preview"
workers_dev = true
preview_urls = true

[env.preview.vars]
DENTLINK_ENV = "preview"
ALLOWED_ORIGINS = "https://dentlink-web-preview.pages.dev"
DENTLINK_BUILD_ID = "preview"
GOOGLE_REDIRECT_URI = "https://dentlink-api-preview.evanjrizzo.workers.dev/v1/connectors/gmail/callback"
GOOGLE_CALENDAR_REDIRECT_URI = "https://dentlink-api-preview.evanjrizzo.workers.dev/v1/connectors/google-calendar/callback"
DENTLINK_WEB_ORIGIN = "https://dentlink-web-preview.pages.dev"
DENTLINK_AI_ENABLED = "true"
DENTLINK_AI_MODEL = "gpt-4.1-mini"
DENTLINK_AI_MAX_INPUT_CHARS = "6000"
DENTLINK_ALERT_EMAIL_TO = "evanjrizzo@gmail.com"
DENTLINK_ALERT_EMAIL_FROM = "alerts@dentlabs.net"
DENTLINK_ARCHIVE_MAX_TOTAL_BYTES = "9000000000"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_ENABLED = "false"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_USER_IDS = ""
DENTLINK_REQUIRE_CONTENT_ENCRYPTION = "true"
DENTLINK_CONTENT_ENCRYPTION_BACKFILL_ENABLED = "false"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "dentlink-preview"
database_id = "fe80f59e-2cba-48ea-8c19-81afb39952a3"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "dentlink-user-archive-preview"

[env.preview.triggers]
crons = ["*/5 * * * *"]

[env.production]
name = "dentlink-api-production"
workers_dev = false
preview_urls = false

# Add production routes only after replacing these placeholders with real Cloudflare values:
# routes = [{ pattern = "api.example.com/*", zone_name = "example.com" }]

[env.production.vars]
DENTLINK_ENV = "production"
ALLOWED_ORIGINS = "https://REPLACE_WITH_PRODUCTION_WEB_ORIGIN"
DENTLINK_BUILD_ID = "production"
GOOGLE_REDIRECT_URI = "https://REPLACE_WITH_PRODUCTION_API_ORIGIN/v1/connectors/gmail/callback"
GOOGLE_CALENDAR_REDIRECT_URI = "https://REPLACE_WITH_PRODUCTION_API_ORIGIN/v1/connectors/google-calendar/callback"
DENTLINK_WEB_ORIGIN = "https://REPLACE_WITH_PRODUCTION_WEB_ORIGIN"
DENTLINK_AI_ENABLED = "true"
DENTLINK_AI_MODEL = "gpt-4.1-mini"
DENTLINK_AI_MAX_INPUT_CHARS = "6000"
DENTLINK_ALERT_EMAIL_TO = "evanjrizzo@gmail.com"
DENTLINK_ALERT_EMAIL_FROM = "alerts@dentlabs.net"
DENTLINK_ARCHIVE_MAX_TOTAL_BYTES = "9000000000"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_ENABLED = "false"
DENTLINK_ARCHIVE_NOTIFICATION_RETENTION_USER_IDS = ""
DENTLINK_REQUIRE_CONTENT_ENCRYPTION = "true"
DENTLINK_CONTENT_ENCRYPTION_BACKFILL_ENABLED = "false"

[[env.production.d1_databases]]
binding = "DB"
database_name = "dentlink-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["*/5 * * * *"]
